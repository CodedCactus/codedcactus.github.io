[project]
site_name = "CodedCactus"
site_description = "A blog about programming, technology, and software development."
site_url = "https://codedcactus.github.io/"
repo_url = "https://github.com/codedcactus"
copyright = "&copy; 2026 <a href=\"https://github.com/codedcactus\" target=\"_blank\" rel=\"noopener\">CodedCactus</a>"

nav = [
  { Home = "index.md" },
  { Blog = ["blog/index.md"] },
  { Tags = "tags.md" },
]

[project.theme]
name = "material"
variant = "classic"
favicon = "assets/favicon_dark.svg"

[project.theme.font]
text = "Inter"
code = "Roboto Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "material/cactus"

[project.theme.features]
"navigation.indexes" = true
"navigation.tabs" = true
"header.autohide" = true
"content.code.copy" = true
"toc.integrate" = true

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "lucide/sun-moon", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "indigo"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "indigo"
toggle = { icon = "lucide/moon-star", name = "Switch to system preference" }

[project.plugins]
privacy = {}
optimize = {}
search = {}
glightbox = {}

[project.plugins.blog]
blog_dir = "blog"
blog_toc = true
archive_pagination_per_page = 10
categories_pagination_per_page = 10

[project.plugins.tags]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/codedcactus"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
pymdownx.blocks.caption = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}