site_name: CodedCactus
site_description: A blog about programming, technology, and software development.
site_url: https://codedcactus.github.io/
repo_url: https://github.com/codedcactus

theme:
  name: material
  variant: classic
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: lucide/moon-star
        name: Switch to system preference
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/cactus
  favicon: assets/favicon_dark.svg
  features:
    - navigation.indexes
    - navigation.tabs
    - header.autohide
    - content.code.copy
    - toc.integrate
nav:
  - Home: index.md
  - Blog:
     - blog/index.md
  - Tags: tags.md

plugins:
  - privacy
  - optimize
  - search
  - glightbox
  - blog:
      blog_dir: blog
      blog_toc: true
      archive_pagination_per_page: 10
      categories_pagination_per_page: 10
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codedcactus

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.superfences

copyright: |
  &copy; 2026 <a href="https://github.com/codedcactus"  target="_blank" rel="noopener">CodedCactus</a>